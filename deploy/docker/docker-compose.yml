name: agentbox

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: agentbox
      POSTGRES_PASSWORD: agentbox
      POSTGRES_DB: agentbox
    ports: ["5434:5432"]
    volumes:
      - ./initdb:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentbox"]
      interval: 3s
      timeout: 3s
      retries: 30

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: agentbox
      MINIO_ROOT_PASSWORD: agentbox123
    ports: ["9010:9000", "9011:9001"]
    volumes:
      - miniodata:/data

  minio-init:
    image: minio/mc:latest
    depends_on: [minio]
    entrypoint: >
      /bin/sh -c "until mc alias set local http://minio:9000 agentbox agentbox123 >/dev/null 2>&1; do sleep 1; done;
      mc mb -p local/agentbox; mc mb -p local/agentbox-test; exit 0"

  mailpit:
    image: axllent/mailpit:latest
    ports: ["1025:1025", "8025:8025"]
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"

  api:
    profiles: [app]
    build: { context: ../.., dockerfile: deploy/docker/Dockerfile }
    command: agentbox api --host 0.0.0.0 --port 8000
    environment: &app_env
      AGENTBOX_DATABASE_URL: postgresql+asyncpg://agentbox:agentbox@postgres:5432/agentbox
      AGENTBOX_S3_ENDPOINT: http://minio:9000
      AGENTBOX_S3_PUBLIC_ENDPOINT: http://localhost:9010
      AGENTBOX_OUTBOUND_SMTP_HOST: mailpit
      AGENTBOX_OUTBOUND_SMTP_PORT: "1025"
      AGENTBOX_APP_SECRET_KEY: ${AGENTBOX_APP_SECRET_KEY:-CHANGE-ME-generate-with-agentbox-keygen}
      AGENTBOX_EDITION: ${AGENTBOX_EDITION:-oss}
      AGENTBOX_PUBLIC_BASE_URL: ${AGENTBOX_PUBLIC_BASE_URL:-http://localhost:8000}
    ports: ["8000:8000"]
    depends_on: [postgres, minio]

  worker:
    profiles: [app]
    build: { context: ../.., dockerfile: deploy/docker/Dockerfile }
    command: agentbox worker
    environment: *app_env
    depends_on: [postgres, minio]

  smtp:
    profiles: [app]
    build: { context: ../.., dockerfile: deploy/docker/Dockerfile }
    command: agentbox smtp
    environment: *app_env
    ports: ["2525:2525"]
    depends_on: [postgres, minio]

volumes:
  pgdata:
  miniodata:
