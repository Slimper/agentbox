[project]
name = "agentbox-sdk"
version = "0.1.0"
description = "Python SDK and MCP server for AgentBox — programmable email identities for AI agents"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
mcp = ["mcp>=1.2"]

[project.scripts]
agentbox-mcp = "agentbox_sdk.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agentbox_sdk"]
